<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ساحر موفيز — أفلام ومسلسلات وكرتون في مكان واحد</title>
<meta name="description" content="مكان واحد منظم تدور فيه على أي فيلم أو مسلسل أو كرتون، وتشوف فين تتفرج عليه قانوني. من غير إعلانات.">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ساحر موفيز">
<style>
:root{
  --bg:#0b1020; --bg2:#111a30; --card:#161f36; --line:#243252;
  --txt:#eef2ff; --dim:#9aa7c7; --accent:#22d3ee; --accent2:#f59e0b;
  --ok:#34d399; --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Kufi Arabic",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
body{padding-bottom:78px}
a{color:inherit;text-decoration:none}
img{display:block}
button{font-family:inherit}

/* header */
header{position:sticky;top:0;z-index:40;background:rgba(11,16,32,.88);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;white-space:nowrap}
.logo span.mark{display:flex;align-items:center}
.searchbar{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:8px 12px;min-width:0}
.searchbar input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--txt);font-size:15px}
.searchbar input::placeholder{color:#6b7a9e}
.install-btn{background:var(--accent);color:#06202a;border:0;border-radius:999px;padding:8px 14px;
  font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap}

/* layout */
main{padding:14px 14px 24px;max-width:1200px;margin:0 auto}
h2.section{font-size:17px;margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
h2.section small{color:var(--dim);font-weight:500;font-size:12px}
.row-scroll{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;
  scrollbar-width:none}
.row-scroll::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}

/* cards */
.card{position:relative;background:var(--card);border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--line);cursor:pointer;scroll-snap-align:start;transition:transform .15s}
.card:active{transform:scale(.97)}
.row-scroll .card{flex:0 0 132px}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#0e1526}
.poster-wrap{position:relative}
.badge{position:absolute;top:6px;inset-inline-start:6px;background:rgba(0,0,0,.72);color:#ffd166;
  font-size:11px;font-weight:800;padding:3px 7px;border-radius:8px;display:flex;gap:3px;align-items:center}
.type-badge{position:absolute;top:6px;inset-inline-end:6px;background:rgba(34,211,238,.9);color:#06202a;
  font-size:10px;font-weight:800;padding:2px 6px;border-radius:7px}
.card .t{font-size:13px;font-weight:700;padding:8px 8px 2px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:44px}
.card .y{font-size:11px;color:var(--dim);padding:0 8px 9px}

/* hero */
.hero{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);margin-bottom:6px;
  min-height:210px;display:flex;align-items:flex-end}
.hero img.bd{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.hero .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,16,32,.15) 0%,rgba(11,16,32,.95) 85%)}
.hero .inner{position:relative;padding:16px;width:100%}
.hero h1{font-size:22px;margin:0 0 6px}
.hero p{margin:0 0 12px;color:#cbd5e1;font-size:13px;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:10px 16px;
  font-weight:800;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);color:#06202a}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--txt);
  border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
.chip.active{background:var(--accent);color:#06202a;border-color:var(--accent)}

/* detail */
.detail-hero{position:relative;border-radius:20px;overflow:hidden;margin:-14px -14px 0;padding:0}
.detail-hero img.bd{width:100%;height:260px;object-fit:cover;opacity:.5}
.detail-hero .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,16,32,.3),var(--bg))}
.detail-head{display:flex;gap:14px;margin-top:-70px;position:relative;padding:0 4px}
.detail-head img.p{width:110px;aspect-ratio:2/3;object-fit:cover;border-radius:14px;border:1px solid var(--line);
  box-shadow:0 10px 30px rgba(0,0,0,.5);background:#0e1526}
.detail-head .meta{flex:1;min-width:0;padding-top:76px}
.detail-head h1{font-size:19px;margin:0 0 4px;line-height:1.35}
.detail-head .orig{color:var(--dim);font-size:12px;margin:0 0 6px}
.stars{color:var(--accent2);font-weight:800;font-size:13px}
.tagline{color:#cbd5e1;font-size:13px;line-height:1.7;margin:12px 2px}
.meta-line{color:var(--dim);font-size:12px;margin:6px 2px;display:flex;gap:8px;flex-wrap:wrap}
.meta-line b{color:var(--txt);font-weight:700}
.genres{display:flex;gap:6px;flex-wrap:wrap;margin:10px 2px}
.genre{background:#1b2743;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11px;color:#cbd5e1}
.block{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:14px 0}
.block h3{margin:0 0 10px;font-size:15px}
.providers{display:flex;flex-wrap:wrap;gap:10px}
.prov{display:flex;flex-direction:column;align-items:center;gap:5px;width:64px;font-size:10px;color:var(--dim);
  text-align:center;line-height:1.25}
.prov img{width:46px;height:46px;border-radius:12px;object-fit:cover;background:#0e1526}
.prov-label{font-size:11px;color:var(--dim);margin:0 0 8px;font-weight:700}
.watch-links{display:grid;gap:8px}
.wlink{display:flex;align-items:center;gap:10px;background:#1b2743;border:1px solid var(--line);
  border-radius:12px;padding:12px;font-size:13px;font-weight:700}
.wlink span.ic{font-size:16px}
.cast{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none}
.cast::-webkit-scrollbar{display:none}
.person{flex:0 0 78px;text-align:center}
.person img{width:78px;height:78px;border-radius:50%;object-fit:cover;background:#0e1526;border:1px solid var(--line)}
.person .n{font-size:11px;margin-top:5px;line-height:1.3;color:#dbe3f4}
.person .r{font-size:10px;color:var(--dim)}
.note{font-size:12px;color:var(--dim);line-height:1.7}

/* tabbar */
.tabbar{position:fixed;bottom:0;inset-inline:0;z-index:50;background:rgba(13,19,36,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.tab{background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:700;padding:2px 6px;cursor:pointer;min-width:60px}
.tab .ic{line-height:0}
.tab.active{color:var(--accent)}


.play-badge{background:rgba(34,211,238,.95)!important;color:#06202a!important;font-weight:800}
.play-block{border-color:#22d3ee!important}
.eplist{display:grid;gap:8px}
.ep{display:flex;align-items:center;gap:10px;background:#1b2743;border:1px solid var(--line);color:var(--txt);
  border-radius:12px;padding:12px;font-size:13.5px;font-weight:700;cursor:pointer;text-align:start;width:100%}
.ep:active{background:#22304f}
.ep .epn{color:var(--accent);font-size:14px}
.ep .ept{flex:1}

/* misc */
footer.credit{text-align:center;color:#6b7a9e;font-size:11.5px;padding:18px 12px 8px;line-height:1.9}
footer.credit b{color:#cbd5e1}
.skeleton{background:linear-gradient(90deg,#161f36,#1d2942,#161f36);background-size:200% 100%;
  animation:sk 1.2s infinite;border-radius:var(--radius)}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{text-align:center;color:var(--dim);padding:40px 16px;font-size:14px;line-height:1.8}
.spinner{width:26px;height:26px;border:3px solid #243252;border-top-color:var(--accent);border-radius:50%;
  animation:spin .8s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:92px;inset-inline:0;margin:auto;width:max-content;max-width:88%;
  background:#1b2743;border:1px solid var(--line);color:#fff;padding:10px 16px;border-radius:999px;
  font-size:13px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
/* player modal */
.modal{position:fixed;inset:0;background:rgba(4,7,15,.94);z-index:90;display:none;flex-direction:column}
.modal.open{display:flex}
.modal .bar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;
  border-bottom:1px solid var(--line);gap:10px}
.modal .bar .ttl{font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal .bar button{background:#1b2743;border:1px solid var(--line);color:#fff;border-radius:10px;
  padding:8px 12px;font-weight:800;cursor:pointer}
.modal iframe{flex:1;width:100%;border:0;background:#000}
</style>
</head>
<body>
<header>
  <a class="logo" href="#/home" aria-label="ساحر موفيز"><span class="mark"><svg width="22" height="22" viewBox="0 0 512 512" aria-hidden="true"><circle cx="256" cy="196" r="86" fill="none" stroke="#22d3ee" stroke-width="26"/><circle cx="256" cy="196" r="34" fill="#22d3ee"/><path d="M150 372 L330 232" stroke="#f59e0b" stroke-width="30" stroke-linecap="round"/><path d="M330 232 l40 -30 l-8 50 z" fill="#f59e0b"/></svg></span> ساحر موفيز</a>
  <form class="searchbar" id="searchForm" role="search">
    <span aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></span>
    <input id="q" type="search" placeholder="دوّر على فيلم، مسلسل، كرتون…" autocomplete="off" enterkeyhint="search">
  </form>
  <button class="install-btn" id="installBtn" hidden>ثبّت</button>
</header>

<main id="app">
  <div class="spinner"></div>
</main>

<nav class="tabbar" id="tabbar">
  <button class="tab" data-go="#/home"><span class="ic"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>الرئيسية</button>
  <button class="tab" data-go="#/movies"><span class="ic"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/><path d="M7 6 5.5 3M12 6 10.5 3M17 6 15.5 3"/></svg></span>أفلام</button>
  <button class="tab" data-go="#/tv"><span class="ic"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="19" height="12.5" rx="2.5"/><path d="M8 3.5 12 7l4-3.5"/></svg></span>مسلسلات</button>
  <button class="tab" data-go="#/cartoon"><span class="ic"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="6.5"/><circle cx="5.5" cy="6.5" r="2.6"/><circle cx="18.5" cy="6.5" r="2.6"/></svg></span>كرتون</button>
  <button class="tab" data-go="#/free"><span class="ic"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8.5" width="18" height="12.5" rx="2"/><path d="M3 13h18M12 8.5V21"/><path d="M12 8.5C10 8.5 7 7.8 7 5.6 7 4.2 8.2 3.5 9.4 4c1.6.7 2.6 4.5 2.6 4.5Zm0 0c2 0 5-.7 5-2.9 0-1.4-1.2-2.1-2.4-1.6C13 4.7 12 8.5 12 8.5Z"/></svg></span>مجاني</button>
</nav>

<footer class="credit">
  <b>صنعه الساحر 🧙‍♂️</b><br>
  بيانات وصور الأفلام من TMDB. هذا المنتج يستخدم واجهة TMDB لكنه غير معتمد أو مصدّق من TMDB.<br>
  كل حاجة هنا من مصادر قانونية. مفيش سيرفرات مقرصنة ومفيش إعلانات.
</footer>

<div class="toast" id="toast"></div>

<div class="modal" id="playerModal">
  <div class="bar">
    <span class="ttl" id="playerTitle">مشاهدة</span>
    <button id="playerClose">إغلاق ✕</button>
  </div>
  <iframe id="playerFrame" allow="autoplay; fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe>
</div>

<script src="app.js"></script>
</body>
</html>
